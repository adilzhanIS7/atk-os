name: release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="out/atk-os-${{ matrix.rid }}"
          dotnet publish src/AtkOs.App -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o "$OUT"
          dotnet publish src/AtkOs.Cli -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o "$OUT"
          rm -f "$OUT"/*.pdb "$OUT"/*.dbg
          rm -rf "$OUT"/*.dSYM
          cp README.md LICENSE "$OUT"/
          if [ "$RUNNER_OS" = "Linux" ]; then cp packaging/linux/70-atk-os.rules "$OUT"/; fi

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/atk-os-${{ matrix.rid }}/* -DestinationPath out/atk-os-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf out/atk-os-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz -C out atk-os-${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.rid }}
          path: |
            out/*.zip
            out/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ATK-OS ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          files: dist/*
